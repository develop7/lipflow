[package]
name = "lipflow-gnome"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Lipflow's native Rust frontend for GNOME Wayland"

[[bin]]
name = "lipflow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
futures-channel = "0.3"
futures-util = "0.3"
gio = "0.21"
glib = "0.21"
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gst = { package = "gstreamer", version = "0.24" }
gst-app = { package = "gstreamer-app", version = "0.24" }
gst-video = { package = "gstreamer-video", version = "0.24" }
pyo3 = { version = "0.26", features = ["auto-initialize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
strip = "debuginfo"
lto = "thin"
